name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # macOS only: the CLI installs macOS engine bundles, and Doctor's platform
      # checks are part of its contract. A Linux box is refused by design, so it
      # cannot be the place these tests prove anything.
      matrix:
        os: [macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit tests (offline, isolated state)
        run: python -m pytest -q
      - name: Byte-compile
        run: python -m compileall -q src

  package:
    name: Build and verify the package
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the built wheel into a fresh environment
        run: |
          python -m venv /tmp/ci-venv
          /tmp/ci-venv/bin/python -m pip install --quiet dist/*.whl
          /tmp/ci-venv/bin/WehniX --version
          /tmp/ci-venv/bin/python -c "import wehnix_cli, wehnix_cli.engine_setup, wehnix_cli.tui.app; print(wehnix_cli.__version__)"
      - name: A launched wheel with no data sets itself up or reports cleanly
        run: |
          set +e
          WEHNIX_CLI_STATE_DIR=/tmp/ci-state HOME=/tmp/ci-home /tmp/ci-venv/bin/WehniX --no-setup
          status=$?
          set -e
          test "$status" -eq 2
          test ! -e /tmp/ci-state
      - name: Doctor is scriptable on a machine with no installation
        run: |
          set +e
          WEHNIX_CLI_STATE_DIR=/tmp/ci-state HOME=/tmp/ci-home /tmp/ci-venv/bin/WehniX doctor --json > /tmp/doctor.json
          status=$?
          set -e
          test "$status" -eq 2
          python -c "import json; d=json.load(open('/tmp/doctor.json')); c={x['name']: x['status'] for x in d['checks']}; assert c['Data folder'] == 'failed'; assert c['Engine 11.17 Universal'] == 'skipped'; assert d['errors'] >= 1"
      - uses: actions/upload-artifact@v4
        with:
          name: wehnix-cli-dist
          path: dist/*
